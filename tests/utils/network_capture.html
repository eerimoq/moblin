<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Network capture bitrates</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --surface-1: #fcfcfb;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --series-3: #1baf7a;
        --series-4: #eda100;
        --series-5: #e87ba4;
        --series-6: #008300;
        --series-7: #4a3aa7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #0d0d0d;
          --surface-1: #1a1a19;
          --text-primary: #ffffff;
          --text-secondary: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --axis: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --series-1: #3987e5;
          --series-2: #d95926;
          --series-3: #199e70;
          --series-4: #c98500;
          --series-5: #d55181;
          --series-6: #008300;
          --series-7: #9085e9;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--page);
        color: var(--text-primary);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      .meta {
        color: var(--text-secondary);
        margin: 0 0 20px;
      }
      .card {
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-right: auto;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: none;
        color: var(--text-primary);
        font: inherit;
        cursor: pointer;
      }
      .chip[aria-pressed="false"] {
        color: var(--muted);
      }
      .chip[aria-pressed="false"] .key {
        opacity: 0.3;
      }
      .key {
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: currentColor;
      }
      .key.dashed {
        background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px);
      }
      select,
      button.action {
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-1);
        color: var(--text-primary);
        font: inherit;
        cursor: pointer;
      }
      .plot {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 420px;
        touch-action: none;
      }
      canvas:focus-visible {
        outline: 2px solid var(--series-1);
        outline-offset: 2px;
      }
      .hint {
        color: var(--muted);
        margin: 8px 0 0;
        font-size: 13px;
      }
      .tooltip {
        position: absolute;
        min-width: 148px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-1);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s;
      }
      .tooltip.visible {
        opacity: 1;
      }
      .tooltip .time {
        color: var(--text-secondary);
        margin-bottom: 6px;
      }
      .tooltip .row {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .tooltip .row .name {
        color: var(--text-secondary);
        margin-right: auto;
      }
      .tooltip .row .value {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: right;
        padding: 6px 8px;
        border-bottom: 1px solid var(--grid);
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        color: var(--text-secondary);
        font-weight: 600;
      }
      td {
        font-variant-numeric: tabular-nums;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      td .name {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .settings {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 0;
      }
      .settings dt {
        color: var(--text-secondary);
      }
      .settings dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Network capture bitrates</h1>
      <p class="meta" id="meta"></p>

      <section class="card" id="settingsCard" hidden>
        <h2>Settings</h2>
        <dl class="settings" id="settings"></dl>
      </section>

      <section class="card">
        <div class="controls">
          <div class="legend" id="legend"></div>
          <label for="smoothing">Average over</label>
          <select id="smoothing">
            <option value="1">1 s</option>
            <option value="5">5 s</option>
            <option value="30">30 s</option>
            <option value="60">60 s</option>
          </select>
          <button class="action" id="reset" type="button">Reset zoom</button>
        </div>
        <div class="plot">
          <canvas id="chart" tabindex="0" aria-label="Bitrate per stream over time"></canvas>
          <div class="tooltip" id="tooltip" role="status"></div>
        </div>
        <p class="hint">Drag to zoom. Double click to reset. Arrow keys move the crosshair.</p>
      </section>

      <section class="card">
        <h2 id="tableTitle">All series</h2>
        <table>
          <thead>
            <tr>
              <th>Series</th>
              <th>Average Mbps</th>
              <th>Maximum Mbps</th>
              <th>Minimum Mbps</th>
              <th>GB</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </main>
    <script>
      const DATA = "__CAPTURE_DATA__";
      const TOTAL_NAME = "Total";
      const PADDING = { left: 64, right: 18, top: 28, bottom: 34 };

      const canvas = document.getElementById("chart");
      const context = canvas.getContext("2d");
      const tooltip = document.getElementById("tooltip");
      const startDate = new Date(DATA.startTime.replace(" ", "T"));
      const length = Math.max(...DATA.series.map((series) => series.bitrates.length));

      const series = DATA.series.map((entry) => ({
        name: entry.name,
        slot: entry.slot,
        bitrates: entry.bitrates,
        smoothed: entry.bitrates,
        dashed: false,
        visible: entry.name !== "Other",
      }));
      const total = {
        name: TOTAL_NAME,
        slot: DATA.totalSlot,
        bitrates: new Array(length).fill(0),
        smoothed: [],
        dashed: true,
        visible: false,
      };
      series.push(total);

      let range = { from: 0, to: length };
      let smoothing = 1;
      let colors = {};
      let crosshair = null;
      let dragging = null;

      function readColors() {
        const style = getComputedStyle(document.documentElement);
        const value = (name) => style.getPropertyValue(name).trim();
        colors = {
          text: value("--text-primary"),
          secondary: value("--text-secondary"),
          muted: value("--muted"),
          grid: value("--grid"),
          axis: value("--axis"),
          surface: value("--surface-1"),
          series: [1, 2, 3, 4, 5, 6, 7].map((index) => value(`--series-${index}`)),
        };
      }

      function colorOf(entry) {
        return colors.series[entry.slot % colors.series.length];
      }

      function updateTotal() {
        const visible = series.filter((entry) => entry !== total && entry.visible);
        for (let index = 0; index < length; index++) {
          let sum = 0;
          for (const entry of visible) {
            sum += entry.bitrates[index] || 0;
          }
          total.bitrates[index] = sum;
        }
      }

      function movingAverage(values, window) {
        if (window <= 1) {
          return values;
        }
        const averaged = new Array(values.length);
        let sum = 0;
        for (let index = 0; index < values.length; index++) {
          sum += values[index];
          if (index >= window) {
            sum -= values[index - window];
          }
          averaged[index] = sum / Math.min(index + 1, window);
        }
        return averaged;
      }

      function updateSmoothing() {
        for (const entry of series) {
          entry.smoothed = movingAverage(entry.bitrates, smoothing);
        }
      }

      function formatDuration(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor(seconds / 60) % 60;
        const remainder = Math.floor(seconds) % 60;
        const padded = `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
        return hours > 0 ? `${hours}:${padded}` : padded;
      }

      function formatClock(seconds) {
        const date = new Date(startDate.getTime() + 1000 * seconds);
        return date.toLocaleTimeString();
      }

      function columnsOf(entry, width) {
        const count = range.to - range.from;
        const perColumn = count / width;
        const values = entry.smoothed;
        const columns = new Array(width);
        for (let column = 0; column < width; column++) {
          const from = range.from + Math.floor(column * perColumn);
          const to = Math.max(from + 1, range.from + Math.floor((column + 1) * perColumn));
          let minimum = Infinity;
          let maximum = -Infinity;
          let sum = 0;
          let samples = 0;
          for (let index = from; index < to && index < length; index++) {
            const value = values[index] || 0;
            minimum = Math.min(minimum, value);
            maximum = Math.max(maximum, value);
            sum += value;
            samples++;
          }
          columns[column] = samples === 0 ? null : { minimum, maximum, average: sum / samples };
        }
        return columns;
      }

      function niceMaximum(value) {
        if (value <= 0) {
          return 1;
        }
        const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
        for (const step of [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]) {
          if (value <= step * magnitude) {
            return step * magnitude;
          }
        }
        return 10 * magnitude;
      }

      function draw() {
        const ratio = window.devicePixelRatio || 1;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, width, height);

        const plotWidth = Math.max(1, Math.round(width - PADDING.left - PADDING.right));
        const plotHeight = Math.max(1, height - PADDING.top - PADDING.bottom);
        const visible = series.filter((entry) => entry.visible);
        const drawn = visible.map((entry) => ({ entry, columns: columnsOf(entry, plotWidth) }));
        let peak = 0;
        for (const { columns } of drawn) {
          for (const column of columns) {
            if (column) {
              peak = Math.max(peak, column.maximum);
            }
          }
        }
        const maximum = niceMaximum(peak);
        const x = (column) => PADDING.left + column;
        const y = (value) => PADDING.top + plotHeight * (1 - value / maximum);

        context.font = "12px system-ui, -apple-system, sans-serif";
        context.strokeStyle = colors.grid;
        context.fillStyle = colors.muted;
        context.lineWidth = 1;
        context.textAlign = "right";
        context.textBaseline = "middle";
        for (let tick = 0; tick <= 5; tick++) {
          const value = (maximum * tick) / 5;
          const position = Math.round(y(value)) + 0.5;
          context.beginPath();
          context.moveTo(PADDING.left, position);
          context.lineTo(PADDING.left + plotWidth, position);
          context.stroke();
          context.fillText(value.toFixed(maximum < 10 ? 1 : 0), PADDING.left - 10, position);
        }
        context.textAlign = "left";
        context.textBaseline = "top";
        context.fillText("Mbps", 8, 4);

        context.textBaseline = "top";
        const ticks = Math.max(2, Math.min(8, Math.floor(plotWidth / 110)));
        for (let tick = 0; tick <= ticks; tick++) {
          const column = (plotWidth * tick) / ticks;
          const second = range.from + ((range.to - range.from) * tick) / ticks;
          context.textAlign = tick === 0 ? "left" : tick === ticks ? "right" : "center";
          context.fillText(formatDuration(second), x(column), PADDING.top + plotHeight + 10);
        }
        context.strokeStyle = colors.axis;
        context.beginPath();
        context.moveTo(PADDING.left, Math.round(y(0)) + 0.5);
        context.lineTo(PADDING.left + plotWidth, Math.round(y(0)) + 0.5);
        context.stroke();

        for (const { entry, columns } of drawn) {
          const color = colorOf(entry);
          context.fillStyle = color;
          context.globalAlpha = 0.18;
          context.beginPath();
          let started = false;
          for (let column = 0; column < columns.length; column++) {
            const value = columns[column];
            if (value) {
              context.lineTo(x(column), y(value.maximum));
              started = true;
            }
          }
          if (started) {
            for (let column = columns.length - 1; column >= 0; column--) {
              const value = columns[column];
              if (value) {
                context.lineTo(x(column), y(value.minimum));
              }
            }
            context.closePath();
            context.fill();
          }
          context.globalAlpha = 1;
          context.strokeStyle = color;
          context.lineWidth = 2;
          context.lineJoin = "round";
          context.setLineDash(entry.dashed ? [6, 4] : []);
          context.beginPath();
          let moved = false;
          for (let column = 0; column < columns.length; column++) {
            const value = columns[column];
            if (!value) {
              continue;
            }
            const position = y(value.average);
            if (moved) {
              context.lineTo(x(column), position);
            } else {
              context.moveTo(x(column), position);
              moved = true;
            }
          }
          context.stroke();
          context.setLineDash([]);
        }

        if (dragging) {
          const from = Math.min(dragging.from, dragging.to);
          const to = Math.max(dragging.from, dragging.to);
          context.fillStyle = colors.text;
          context.globalAlpha = 0.08;
          context.fillRect(from, PADDING.top, to - from, plotHeight);
          context.globalAlpha = 1;
        } else if (crosshair !== null) {
          const position = Math.round(PADDING.left + crosshair.column) + 0.5;
          context.strokeStyle = colors.axis;
          context.lineWidth = 1;
          context.beginPath();
          context.moveTo(position, PADDING.top);
          context.lineTo(position, PADDING.top + plotHeight);
          context.stroke();
          for (const entry of visible) {
            context.beginPath();
            context.arc(position, y(entry.smoothed[crosshair.index] || 0), 3.5, 0, 2 * Math.PI);
            context.fillStyle = colorOf(entry);
            context.fill();
            context.strokeStyle = colors.surface;
            context.lineWidth = 2;
            context.stroke();
          }
        }
      }

      function plotWidthOf() {
        return Math.max(1, Math.round(canvas.clientWidth - PADDING.left - PADDING.right));
      }

      function showTooltip() {
        if (crosshair === null) {
          tooltip.classList.remove("visible");
          return;
        }
        const rows = document.createElement("div");
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = `${formatDuration(crosshair.index)} (${formatClock(crosshair.index)})`;
        rows.appendChild(time);
        for (const entry of series.filter((candidate) => candidate.visible)) {
          const row = document.createElement("div");
          row.className = "row";
          const key = document.createElement("span");
          key.className = entry.dashed ? "key dashed" : "key";
          key.style.color = colorOf(entry);
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = entry.name;
          const value = document.createElement("span");
          value.className = "value";
          value.textContent = `${(entry.smoothed[crosshair.index] || 0).toFixed(2)} Mbps`;
          row.append(key, name, value);
          rows.appendChild(row);
        }
        tooltip.replaceChildren(rows);
        tooltip.classList.add("visible");
        const width = tooltip.offsetWidth;
        const position = PADDING.left + crosshair.column;
        const left = position > canvas.clientWidth / 2 ? position - width - 16 : position + 16;
        tooltip.style.left = `${Math.max(4, Math.min(left, canvas.clientWidth - width - 4))}px`;
        tooltip.style.top = `${PADDING.top + 8}px`;
      }

      function updateTable() {
        const body = document.getElementById("tableBody");
        const rows = [];
        for (const entry of series) {
          if (!entry.visible) {
            continue;
          }
          let sum = 0;
          let maximum = 0;
          let minimum = Infinity;
          for (let index = range.from; index < range.to; index++) {
            const value = entry.bitrates[index] || 0;
            sum += value;
            maximum = Math.max(maximum, value);
            minimum = Math.min(minimum, value);
          }
          const seconds = Math.max(1, range.to - range.from);
          const row = document.createElement("tr");
          const name = document.createElement("td");
          const label = document.createElement("span");
          label.className = "name";
          const key = document.createElement("span");
          key.className = entry.dashed ? "key dashed" : "key";
          key.style.color = colorOf(entry);
          const text = document.createElement("span");
          text.textContent = entry.name;
          label.append(key, text);
          name.appendChild(label);
          row.appendChild(name);
          for (const value of [
            (sum / seconds).toFixed(2),
            maximum.toFixed(2),
            (minimum === Infinity ? 0 : minimum).toFixed(2),
            ((1e6 * sum) / 8 / 1e9).toFixed(2),
          ]) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          }
          rows.push(row);
        }
        body.replaceChildren(...rows);
        const title = range.from === 0 && range.to === length ? "All series" : "Zoomed to";
        document.getElementById("tableTitle").textContent =
          `${title} ${formatDuration(range.from)} - ${formatDuration(range.to)}`;
      }

      function render() {
        updateTotal();
        updateSmoothing();
        draw();
        updateTable();
        showTooltip();
      }

      function indexAt(offsetX) {
        const width = plotWidthOf();
        const column = Math.min(width - 1, Math.max(0, offsetX - PADDING.left));
        const index = Math.min(
          length - 1,
          Math.floor(range.from + ((range.to - range.from) * column) / width),
        );
        return { column, index };
      }

      function buildLegend() {
        const legend = document.getElementById("legend");
        for (const entry of series) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.setAttribute("aria-pressed", String(entry.visible));
          const key = document.createElement("span");
          key.className = entry.dashed ? "key dashed" : "key";
          key.style.color = colorOf(entry);
          const name = document.createElement("span");
          name.textContent = entry.name;
          chip.append(key, name);
          chip.addEventListener("click", () => {
            entry.visible = !entry.visible;
            chip.setAttribute("aria-pressed", String(entry.visible));
            render();
          });
          legend.appendChild(chip);
        }
      }

      canvas.addEventListener("pointermove", (event) => {
        if (dragging) {
          dragging.to = Math.min(
            PADDING.left + plotWidthOf(),
            Math.max(PADDING.left, event.offsetX),
          );
          draw();
          return;
        }
        crosshair = indexAt(event.offsetX);
        draw();
        showTooltip();
      });

      canvas.addEventListener("pointerleave", () => {
        if (!dragging) {
          crosshair = null;
          draw();
          showTooltip();
        }
      });

      canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture(event.pointerId);
        dragging = { from: event.offsetX, to: event.offsetX };
        crosshair = null;
        tooltip.classList.remove("visible");
      });

      canvas.addEventListener("pointerup", (event) => {
        if (!dragging) {
          return;
        }
        const from = Math.min(dragging.from, dragging.to);
        const to = Math.max(dragging.from, dragging.to);
        dragging = null;
        if (to - from > 5) {
          const start = indexAt(from).index;
          const end = indexAt(to).index;
          if (end - start >= 2) {
            range = { from: start, to: end };
          }
        }
        crosshair = indexAt(event.offsetX);
        render();
      });

      canvas.addEventListener("dblclick", () => {
        range = { from: 0, to: length };
        render();
      });

      canvas.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 60 : 1;
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
          return;
        }
        event.preventDefault();
        const width = plotWidthOf();
        const current = crosshair ? crosshair.index : range.from;
        const index = Math.min(
          range.to - 1,
          Math.max(range.from, current + (event.key === "ArrowLeft" ? -step : step)),
        );
        const column = ((index - range.from) * width) / Math.max(1, range.to - range.from);
        crosshair = { column, index };
        draw();
        showTooltip();
      });

      document.getElementById("smoothing").addEventListener("change", (event) => {
        smoothing = Number(event.target.value);
        render();
      });

      document.getElementById("reset").addEventListener("click", () => {
        range = { from: 0, to: length };
        render();
      });

      window.addEventListener("resize", () => {
        crosshair = null;
        draw();
        showTooltip();
      });

      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        readColors();
        render();
      });

      document.getElementById("meta").textContent =
        `Started ${DATA.startTime} · ${DATA.duration} · ${DATA.files}`;

      function renderSettings() {
        const settings = DATA.settings || [];
        if (settings.length === 0) {
          return;
        }
        const list = document.getElementById("settings");
        for (const setting of settings) {
          const name = document.createElement("dt");
          name.textContent = setting.name;
          const value = document.createElement("dd");
          value.textContent = setting.value;
          list.append(name, value);
        }
        document.getElementById("settingsCard").hidden = false;
      }

      renderSettings();
      document.getElementById("smoothing").value = String(smoothing);
      readColors();
      buildLegend();
      render();
    </script>
  </body>
</html>
