<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="BrowserWidgetReport.js" data-name="BodyReplace"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      video {
        position: absolute;
        top: 0;
      }
    </style>
    <script>
      function showAlert(x) {
        document.body.innerHTML = `
          <video src="BrowserWidgetHighFpsVideo.mp4" width="400" height="400" style="left: ${x}px"
                 autoplay muted playsinline></video>`;
      }

      setTimeout(() => showAlert(0), 3000);
      setTimeout(() => showAlert(960), 7000);
      setTimeout(() => browserWidgetReport("ok"), 12000);
    </script>
  </head>
  <body></body>
</html>
