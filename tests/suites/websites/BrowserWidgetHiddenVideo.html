<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="BrowserWidgetReport.js" data-name="HiddenVideo"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      video {
        position: absolute;
        top: 0;
      }
      #visible {
        left: 0;
      }
      #hidden-parent {
        display: none;
      }
      #hidden-parent video {
        left: 1440px;
      }
    </style>
  </head>
  <body>
    <video id="visible" src="BrowserWidgetHighFpsVideo.mp4" width="400" height="400" autoplay loop muted playsinline></video>
    <div id="hidden-parent">
      <video src="BrowserWidgetHighFpsVideo.mp4" width="400" height="400" autoplay loop muted playsinline></video>
    </div>
    <script>
      window.addEventListener("load", () => browserWidgetReport("ok"));
    </script>
  </body>
</html>
