<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="BrowserWidgetReport.js" data-name="VideoSound"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      video {
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <video src="BrowserWidgetBeepsVideo.mp4" width="400" height="400" autoplay playsinline></video>
    <script>
      document.querySelector("video").addEventListener("playing", () => {
        if (document.querySelector("video").muted) {
          browserWidgetReport("error: Video is muted");
        } else {
          browserWidgetReport("ok");
        }
      });
    </script>
  </body>
</html>
