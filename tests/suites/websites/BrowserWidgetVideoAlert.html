<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="BrowserWidgetReport.js" data-name="VideoAlert"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .alert {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 40px;
        border-radius: 24px;
        animation: slide-in 0.5s ease-out;
      }
      .message {
        font: bold 64px sans-serif;
        color: white;
      }
      @keyframes slide-in {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <script>
      function showAlert() {
        const alert = document.createElement("div");
        alert.className = "alert";
        const video = document.createElement("video");
        video.src = "BrowserWidgetHighFpsVideo.mp4";
        video.width = 400;
        video.height = 400;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        video.addEventListener("ended", () => {
          alert.remove();
          browserWidgetReport("ok");
        });
        const message = document.createElement("div");
        message.className = "message";
        message.textContent = "Alice just followed!";
        alert.append(video, message);
        document.body.appendChild(alert);
      }

      setTimeout(showAlert, 4000);
    </script>
  </body>
</html>
