name: All

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Brew update
        run: |
          brew update
      - name: Install tools
        run: |
          brew install just swiftformat swiftlint oxfmt oxlint codespell
      - name: Source code styling
        run: |
          just style-check
      - name: Linting
        run: |
          just lint
      - name: Spell checking
        run: |
          just spell-check
      - name: Web remote control frontend
        run: |
          just web-remote-control-frontend-prepare
          just web-remote-control-frontend-build
          git diff --exit-code

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Create user config
        run: |
          cp User.template.xcconfig Config/User.xcconfig
      - name: Cache keys
        id: keys
        run: |
          echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "day=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Swift packages
        id: swift-packages
        uses: actions/cache/restore@v4
        with:
          path: DerivedData/SourcePackages
          key: swift-packages-${{ steps.keys.outputs.xcode }}-${{ hashFiles('Moblin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData/CompilationCache.noindex
          key: compilation-cache-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.day }}
          restore-keys: |
            compilation-cache-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.month }}-
      - name: Build
        run: |
          xcodebuild \
              -scheme Moblin \
              -derivedDataPath DerivedData \
              -skipPackagePluginValidation \
              build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              COMPILATION_CACHE_ENABLE_CACHING=YES
      - name: Save Swift packages
        if: github.ref == 'refs/heads/main' && steps.swift-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}
      - name: Save compilation cache
        if: github.ref == 'refs/heads/main' && steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: DerivedData/CompilationCache.noindex
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
