name: All

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Brew update
        run: |
          brew update
      - name: Install tools
        run: |
          brew install just swiftformat swiftlint oxfmt oxlint codespell
      - name: Source code styling
        run: |
          just style-check
      - name: Linting
        run: |
          just lint
      - name: Spell checking
        run: |
          just spell-check
      - name: Web remote control frontend
        run: |
          just web-remote-control-frontend-prepare
          just web-remote-control-frontend-build
          git diff --exit-code

